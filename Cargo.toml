[package]
name = "qxq"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/waterlens/qxq"
description = "A playground for interpreters and JIT compilers"
license = "MIT"

[workspace]
members = ["qxq_macros"]

[dependencies]
anyhow = "1.0.102"
boxing = "0.1.2"
bumpalo = "3.20.2"
by_address = "1.2.1"
hashbrown = "0.16"
hashconsing = "1.6.0"
im = "15.1.0"
indexmap = "2.13.0"
itertools = "0.14"
once_cell = "1.21"
ordermap = "1.1.0"
phf = { version = "0.13", features = ["macros"] }
small-map = "0.1.5"
smallvec = "1.15.1"
rustyline = { version = "17.0", features = ["derive"] }
chrono = "0.4.42"
slotmap = "1.1.1"
dirs = "6.0.0"
clap = { version = "4.5.60", features = ["derive"] }
qxq_macros = { path = "qxq_macros" }
ssof = "0.2.1"
serde_json = "1.0.149"
color_print = { version = "0.3.7", package = "color-print" }
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies]
bindgen = "0.72"
cc = "1.2"

[lints.clippy]
too_many_arguments = "allow"
