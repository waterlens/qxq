[package]
name = "qxq"
version = "0.1.0"
edition = "2021"
description = "A playground for interpreters and JIT compilers"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
boxing = "0.1.2"
bumpalo = "3.19.1"
by_address = "1.2.1"
hashbrown = "0.16"
hashconsing = "1.6.0"
im = "15.1.0"
indexmap = "2.13.0"
itertools = "0.14"
once_cell = "1.21"
ordermap = "1.1.0"
phf = { version = "0.13", features = ["macros"] }
small-map = "0.1.5"
smallvec = "1.15.1"
rustyline = { version = "17.0", features = ["derive"] }
chrono = "0.4.42"
slotmap = "1.1.1"
dirs = "6.0.0"

[lints.clippy]
too_many_arguments = "allow"
